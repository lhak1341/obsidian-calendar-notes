name: Build plugin

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "*" # Push events to matching any tag format, i.e. 1.0, 20.15.10

permissions:
  contents: write

env:
  # Must match the id in manifest.json — it names the folder Obsidian
  # installs the plugin into.
  PLUGIN_NAME: obsidian-calendar-notes

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # See main.yml: bun.lock is the committed lockfile, not yarn.lock.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `build` runs lint (svelte-check + eslint + tsc --noEmit) before
      # esbuild, so a tag cannot ship output that does not typecheck.
      # esbuild emits both main.js and styles.css.
      - name: Build
        run: bun run build

      - name: Package plugin folder
        run: |
          mkdir "$PLUGIN_NAME"
          cp main.js manifest.json styles.css "$PLUGIN_NAME"
          zip -r "$PLUGIN_NAME.zip" "$PLUGIN_NAME"

      # `gh release create` replaces actions/create-release@v1 plus four
      # actions/upload-release-asset@v1 steps. Both actions are archived, and
      # the old tag_name plumbing went through `::set-output`, which GitHub
      # disabled — this workflow could not have produced a release.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            "$PLUGIN_NAME.zip" main.js manifest.json styles.css \
            --title "$tag" \
            --generate-notes
